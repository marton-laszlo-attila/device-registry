# Requests for any other Host are refused. This stops DNS rebinding: a web page
# that points its own domain at 127.0.0.1 would otherwise be same-origin with the
# API (which has no authentication) and could bypass the CORS policy.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    return 421;
}

server {
    listen 80;
    server_name localhost 127.0.0.1 [::1];
    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
